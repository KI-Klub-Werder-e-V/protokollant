[project]
name = "protokollant"
version = "0.1.0.dev0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "jinja2>=3.1",
  "mcp>=1.2",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
  "weasyprint>=62",
]

[project.optional-dependencies]
ml = ["faster-whisper>=1.1", "pyannote-audio>=4.0"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
